name: 'Swift Binding Generator Core CI Env'
description: 'Prepare the CI environment (check Swift version, cache SwiftPM checkouts).'

runs:
  using: composite
  steps:
    - name: Check Swift version
      shell: bash
      run: swift -version
    - name: Cache local SwiftPM repository
      if: matrix.os_version == 'noble'
      uses: actions/cache@v6
      continue-on-error: true
      with:
        path: /__w/swift-binding-generator-core/swift-binding-generator-core/.build/checkouts
        key: ${{ runner.os }}-swiftpm-cache-${{ hashFiles('Package.swift') }}
        restore-keys: |
          ${{ runner.os }}-swiftpm-cache
          ${{ runner.os }}-swiftpm-
